name: Arcana Squad CI

on:
  push:
    branches:
      - main
      - docs/arcana-card-system
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and generate TanStack routes
        run: npm run build

      - name: Typecheck generated route tree
        run: npm run typecheck

      - name: Test
        run: npm test
